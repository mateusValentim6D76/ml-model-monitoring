[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-monitoring"
version = "1.0.0"
description = "Observabilidade contínua, data contracts, detecção de drift e governança (LGPD) para um modelo de Credit Scoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",            # Evidently 0.7 ainda não suporta pandas 3
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandera>=0.20",
    "evidently>=0.7",
    "mlflow>=2.14",
    "plotly>=5.20",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pyarrow>=14",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
credit-monitor = "credit_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
